[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_PUBLIC_SITE_URL = "https://expalapp.netlify.app"
  NEXT_PUBLIC_APP_URL = "https://expalapp.netlify.app"
  NEXT_PUBLIC_API_URL = "https://expalapp-1.onrender.com"
  NEXT_PUBLIC_APP_ID = "com.yourbrandexpal"
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN = "expalapp-a6422.firebaseapp.com"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID = "expalapp-a6422"

[[plugins]]
  package = "@netlify/plugin-nextjs"
